# Cloudflare Workers 项目配置：D1 / R2 绑定与站点级变量声明。
# 部署前需要在 Cloudflare 控制台创建同名的 D1 / R2 资源，并把真实 database_id 填进来。
#
# ⚠️ 这里**刻意不写 `main` / `assets`**：
# 本仓库的 Worker 入口与静态资源目录由 @astrojs/cloudflare 在构建时产出，
# 而构建期间 @cloudflare/vite-plugin 会先校验配置里的 `main` 必须已存在 —— 它恰恰是本次构建才生成的，
# 写上去会让首次构建必然失败（先有鸡还是先有蛋，实测报 "main field ... doesn't point to an existing file"）。
# 真正拿来部署的是构建产物里的 apps/web/dist/server/wrangler.json：它由本文件自动继承
# 绑定、变量与兼容性日期，并补上 main / assets。部署命令：
#   npx wrangler deploy --config apps/web/dist/server/wrangler.json
#
# 另外：本项目部署到 Cloudflare Workers，**不是 Cloudflare Pages**
# （@astrojs/cloudflare v14 已移除 Pages 支持），所以不要写 pages_build_output_dir。

name = "portfolio"
compatibility_date = "2026-10-01"

# 站点级明文环境变量（非密钥）。改成真实的访问地址，RSS / sitemap 的绝对链接依赖它
# （rss.xml.ts / sitemap.xml.ts 读的就是这里的运行时 SITE_URL）。
[vars]
SITE_URL = "https://portfolio.1063968857.workers.dev"

# 本地 D1：`pnpm db:migrate:local` 会据此在 .wrangler/state 下创建本地实例
[[d1_databases]]
binding = "DB"
database_name = "portfolio-db"
database_id = "cf852575-b646-4d09-9745-5985874d5387"

# 图片对象存储绑定。
#
# ⚠️ 这里用 **Workers KV** 而不是 R2：启用 R2 必须先绑定银行卡，而 KV 的免费额度
# （1GB 存储 / 10 万次读每天 / 1000 次写每天）无需绑卡，对个人站的图片量完全够用。
# 绑定名沿用 MEDIA，代码侧只换了后端实现（见 apps/web/src/lib/server/storage.ts）。
# 代价：单值上限 25MiB（上传接口本就限制 5MB）、写入最终一致；key 含 uuid 且内容永不覆写，
# 读取端又走 immutable 长缓存，因此这两点在项目里都不构成问题。
[[kv_namespaces]]
binding = "MEDIA"
id = "1d7f23db431f4417a4f028187409244c"
